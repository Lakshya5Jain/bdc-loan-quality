[project]
name = "soi"
version = "0.1.0"
description = "BDC loan-quality tracker built on SEC XBRL schedule-of-investments data"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=17",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "rapidfuzz>=3.5",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
soi = "soi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soi", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "DTZ011", "ISC004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
